components:
  securitySchemes:
    ConsoleAdmin:
      type: http
      scheme: bearer
      description: 独立服务从 SEEKMEMORY_CONSOLE_TOKEN 读取管理员令牌；浏览器仅在页面内存持有，不写入 URL 或本地存储。
    AstrBotAdmin:
      type: http
      scheme: bearer
      description: 宿主验证管理员身份并注入 request.username；插件页面使用宿主桥接，不持有或读取 token。
  schemas:
    JsonValue:
      description: 任意 JSON 值。扩展容器元素在传输类型中为 unknown，由 Zod 递归校验；不使用 any。
      type:
      - 'null'
      - boolean
      - number
      - string
      - array
      - object
      items: {}
      additionalProperties: true
    JsonObject:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/JsonValue'
    Scope:
      type: string
      enum:
      - private
      - shared
      - shadow
    MemoryState:
      type: string
      enum:
      - active
      - forgotten
      - merged
    MemoryCategory:
      type: string
      enum:
      - fact
      - scene
      - detail
      - impression
      - persona
      - example
      - media
      - secret
      - designated
    MemoryVersion:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        at:
          type: string
          format: date-time
        text:
          type: string
          minLength: 1
      required:
      - revision
      - at
      - text
      additionalProperties: false
    MemoryRecord:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/MemoryCategory'
        state:
          $ref: '#/components/schemas/MemoryState'
        scope:
          $ref: '#/components/schemas/Scope'
        subject:
          type: string
          minLength: 1
        session:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
            minLength: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        hits:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        versions:
          type: array
          items:
            $ref: '#/components/schemas/MemoryVersion'
          minItems: 1
        relatedIds:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - id
      - title
      - text
      - category
      - state
      - scope
      - subject
      - session
      - tags
      - confidence
      - hits
      - updatedAt
      - versions
      - relatedIds
      additionalProperties: false
      description: 统一记忆库投影。版本号唯一且降序，最新版本内容与 text 一致；这些跨字段规则由 Zod 和业务测试补充验证。
    RecordsResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/MemoryRecord'
      required:
      - records
      additionalProperties: false
    ArtifactHeader:
      type: object
      properties:
        id:
          type: string
        family:
          type: string
        revision:
          type: integer
          minimum: 1
        state:
          $ref: '#/components/schemas/MemoryState'
        scope:
          $ref: '#/components/schemas/Scope'
        subject_id:
          type: string
        said_by:
          type: string
        time:
          type: object
          properties:
            created:
              type: string
            updated:
              type: string
            valid_from:
              type:
              - string
              - 'null'
            valid_to:
              type:
              - string
              - 'null'
            expires:
              type:
              - string
              - 'null'
          additionalProperties: true
      required:
      - id
      - family
      - revision
      - state
      - scope
      additionalProperties: true
    ArtifactDetail:
      type: object
      properties:
        artifact:
          type: object
          properties:
            header:
              $ref: '#/components/schemas/ArtifactHeader'
            payload:
              $ref: '#/components/schemas/JsonObject'
          required:
          - header
          - payload
          additionalProperties: false
        versions:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
        ledger:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
      required:
      - artifact
      - versions
      - sources
      - ledger
      additionalProperties: false
      description: 原始快照、来源和账本保持 JSON 扩展字段；不补造历史缺失数据。header 允许既有 lineage、strength、time 等字段。
    PendingTopic:
      type: object
      properties:
        id:
          type: string
        session:
          type: string
        count:
          type: integer
          minimum: 1
        oldestAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - session
      - count
      - oldestAt
      additionalProperties: false
      description: 按上游话题分组的待处理消息，仅提供计数和时间，不返回对话正文。
    CapacityStatus:
      type: object
      properties:
        state:
          type: string
          enum:
          - normal
          - pressured
          - saturated
          - protective
        actions:
          type: array
          items:
            type: string
        reasons:
          type: array
          items:
            type: string
        pressure:
          type: number
          minimum: 0
          maximum: 1
        snapshot:
          type: object
          properties:
            sourceRows:
              type: integer
              minimum: 0
            sourceBytes:
              type: integer
              minimum: 0
            pendingRows:
              type: integer
              minimum: 0
            deferredRows:
              type: integer
              minimum: 0
            deadRows:
              type: integer
              minimum: 0
            databaseBytes:
              type: integer
              minimum: 0
            artifactCount:
              type: integer
              minimum: 0
            artifactBytes:
              type: integer
              minimum: 0
            contextChars:
              type: integer
              minimum: 0
            traceRows:
              type: integer
              minimum: 0
          required:
          - sourceRows
          - sourceBytes
          - pendingRows
          - deferredRows
          - deadRows
          - databaseBytes
          - artifactCount
          - artifactBytes
          - contextChars
          - traceRows
          additionalProperties: false
        queue:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
      required:
      - state
      - actions
      - reasons
      - pressure
      - snapshot
      - queue
      additionalProperties: false
    ContextBudget:
      type: object
      properties:
        injection_chars:
          type: integer
          minimum: 0
        system_chars:
          type: integer
          minimum: 0
        group_context_messages:
          type: integer
          minimum: 0
        history_messages:
          type: integer
          minimum: 0
        source_recall_enabled:
          type: boolean
        source_recall_hours:
          type: integer
          minimum: 1
        source_recall_max_candidates:
          type: integer
          minimum: 1
        estimate_tokens:
          type: integer
          minimum: 0
      required:
      - injection_chars
      - system_chars
      - group_context_messages
      - history_messages
      - source_recall_enabled
      - source_recall_hours
      - source_recall_max_candidates
      - estimate_tokens
      additionalProperties: false
    DreamRun:
      type: object
      properties:
        date:
          type: string
        status:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        batches:
          type: integer
          minimum: 0
        written:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            type: string
        summary:
          type: object
          additionalProperties: true
      required:
      - date
      - status
      - started_at
      - finished_at
      - batches
      - written
      - errors
      - summary
      additionalProperties: false
    DreamStatus:
      type: object
      properties:
        enabled:
          type: boolean
        at:
          type: string
        today:
          type: string
        today_run:
          anyOf:
          - $ref: '#/components/schemas/DreamRun'
          - type: 'null'
        due:
          type: boolean
        recent:
          type: array
          items:
            $ref: '#/components/schemas/DreamRun'
      required:
      - enabled
      - at
      - today
      - today_run
      - due
      - recent
      additionalProperties: false
    PersonaTimeline:
      type: object
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 0
        text:
          type: string
        origin:
          type: string
        synthesis:
          type: string
        changeReason:
          type: string
        revisions:
          type: array
          items:
            type: object
            properties:
              revision:
                type: integer
                minimum: 0
              at:
                type: string
              op:
                type: string
              text:
                type: string
              origin:
                type: string
              synthesis:
                type: string
              changeReason:
                type: string
              derivedFrom:
                type: array
                items:
                  type: string
              sourceIds:
                type: array
                items:
                  type: string
            required:
            - revision
            - at
            - op
            - text
            additionalProperties: false
          description: 每个版本只回溯自身历史 header 的证据；旧版本缺少证据时省略数组，不复制当前版本证据。
        corpusCount:
          type: integer
          minimum: 0
        seedId:
          type: string
        seedVersion:
          type: string
      required:
      - id
      - revision
      - text
      - revisions
      additionalProperties: false
    RuntimeStatus:
      type: object
      properties:
        capabilities:
          type: object
          properties:
            maintenanceTasks:
              type: boolean
          required:
          - maintenanceTasks
          additionalProperties: false
        ready:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              ok:
                type: boolean
              detail:
                type: string
            required:
            - name
            - ok
            - detail
            additionalProperties: false
        activeTask:
          anyOf:
          - type: object
            properties:
              id:
                type: string
              kind:
                type: string
            required:
            - id
            - kind
            additionalProperties: false
          - type: 'null'
        pending:
          type: array
          items:
            type: object
            properties:
              session:
                type: string
              count:
                type: integer
                minimum: 0
            required:
            - session
            - count
            additionalProperties: false
        pendingTopics:
          type: array
          items:
            $ref: '#/components/schemas/PendingTopic'
        extractionPolicy:
          type: object
          properties:
            backlogThreshold:
              type: integer
            topicTtlSeconds:
              type: number
            maxTopicsPerBatch:
              type: integer
              minimum: 1
          required:
          - backlogThreshold
          - topicTtlSeconds
          - maxTopicsPerBatch
          additionalProperties: false
        capacity:
          anyOf:
          - $ref: '#/components/schemas/CapacityStatus'
          - type: 'null'
        persona:
          anyOf:
          - $ref: '#/components/schemas/PersonaTimeline'
          - type: 'null'
        budget:
          anyOf:
          - $ref: '#/components/schemas/ContextBudget'
          - type: 'null'
        dream:
          anyOf:
          - $ref: '#/components/schemas/DreamStatus'
          - type: 'null'
        checkpointPending:
          type:
          - integer
          - 'null'
          minimum: 0
        schedulerCount:
          type: integer
          minimum: 0
        config:
          $ref: '#/components/schemas/JsonObject'
      required:
      - ready
      - checks
      - activeTask
      - pending
      - pendingTopics
      - extractionPolicy
      - capacity
      - checkpointPending
      - schedulerCount
      - config
      additionalProperties: false
    LogSource:
      type: object
      properties:
        module:
          type: string
        file:
          type: string
        function:
          type: string
        line:
          type: integer
          minimum: 1
      required:
      - module
      - file
      - function
      - line
      additionalProperties: false
    OperationEvent:
      type: object
      properties:
        id:
          type: string
        at:
          type: string
        kind:
          type: string
        status:
          type: string
        message:
          type: string
        taskId:
          type: string
        level:
          type: string
          enum:
          - DEBUG
          - INFO
          - WARNING
          - ERROR
        stage:
          type: string
        source:
          anyOf:
          - $ref: '#/components/schemas/LogSource'
          - type: 'null'
        context:
          type: object
          additionalProperties:
            type:
            - string
            - number
            - boolean
            - 'null'
        durationMs:
          type:
          - number
          - 'null'
          minimum: 0
        error:
          anyOf:
          - type: object
            properties:
              type:
                type: string
              frames:
                type: array
                items:
                  $ref: '#/components/schemas/LogSource'
            required:
            - type
            - frames
            additionalProperties: false
          - type: 'null'
      required:
      - id
      - at
      - kind
      - status
      - message
      - taskId
      additionalProperties: false
      description: 兼容旧日志：level、stage、source、context、durationMs、error 可缺省，前端再补默认值，不伪造位置。
    EventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/OperationEvent'
          maxItems: 500
        capacity:
          type: integer
          const: 500
      required:
      - events
      - capacity
      additionalProperties: false
    DiagnosticQuery:
      type: object
      properties:
        query:
