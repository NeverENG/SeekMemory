openapi: 3.1.0
info:
  title: SeekMemory 管理接口
  version: 1.0.0
  description: 描述 Context.register_web_api 注册的插件路由与 JSON 正文。实际 HTTP 前缀、管理员认证及 iframe 通信由 AstrBot 宿主负责；前端通过 AstrBotPluginPage.apiGet/apiPost
    使用 manage/<action>，不自行拼接 URL。成功响应直接返回数据，失败使用宿主错误结构；宿主代理还可能在进入插件前拒绝请求。本契约版本独立于插件发布版本。
security:
- AstrBotAdmin: []
paths:
  /astrbot_plugin_seekmemory/manage/records:
    get:
      operationId: records
      summary: 列出全部家族、scope 和状态的记忆
      responses:
        '200':
          description: 操作成功，直接返回数据，无额外 envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsResponse'
        '401':
          description: 未登录管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 记忆或操作不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 请求方法不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 记忆引擎不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /astrbot_plugin_seekmemory/manage/status:
    get:
      operationId: status
      summary: 查看引擎、模型配置与任务状态
      responses:
        '200':
          description: 操作成功，直接返回数据，无额外 envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
        '401':
          description: 未登录管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 记忆或操作不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 请求方法不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 记忆引擎不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /astrbot_plugin_seekmemory/manage/detail:
    get:
      operationId: detail
      summary: 查看原始正文、版本、来源与账本
      responses:
        '200':
          description: 操作成功，直接返回数据，无额外 envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '401':
          description: 未登录管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 记忆或操作不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 请求方法不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 记忆引擎不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
  /astrbot_plugin_seekmemory/manage/events:
    get:
      operationId: events
      summary: 读取最近的生命周期日志
      responses:
        '200':
          description: 操作成功，直接返回数据，无额外 envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '401':
          description: 未登录管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 记忆或操作不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 请求方法不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 记忆引擎不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
        description: 业务类型，精确匹配
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: 生命周期状态，精确匹配
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: 消息或任务 ID 的子串，不区分大小写
  /astrbot_plugin_seekmemory/manage/update:
    post:
      operationId: update
      summary: 追加人工修订
      responses:
        '200':
          description: 操作成功，直接返回数据，无额外 envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          description: 输入校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 记忆或操作不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 请求方法不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本冲突、任务忙碌或目标任务已结束
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 请求体超过 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 记忆引擎不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: 请求体最多 64 KiB。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommand'
  /astrbot_plugin_seekmemory/manage/diagnose:
    post:
      operationId: diagnose
      summary: 只读预演召回
      responses:
        '200':
          description: 操作成功，直接返回数据，无额外 envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostic'
        '400':
          description: 输入校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 记忆或操作不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 请求方法不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本冲突、任务忙碌或目标任务已结束
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 请求体超过 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 记忆引擎不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: 请求体最多 64 KiB。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticQuery'
  /astrbot_plugin_seekmemory/manage/task:
    post:
      operationId: task
      summary: 提交抽取或每周整理任务
      responses:
        '200':
          description: 操作成功，直接返回数据，无额外 envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          description: 输入校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 记忆或操作不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 请求方法不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本冲突、任务忙碌或目标任务已结束
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 请求体超过 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 记忆引擎不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: 请求体最多 64 KiB。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCommand'
  /astrbot_plugin_seekmemory/manage/cancel:
    post:
      operationId: cancel
      summary: 取消指定的当前任务
      responses:
        '200':
          description: 操作成功，直接返回数据，无额外 envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          description: 输入校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 记忆或操作不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 请求方法不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本冲突、任务忙碌或目标任务已结束
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 请求体超过 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 记忆引擎不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        description: 请求体最多 64 KiB。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelCommand'
  /astrbot_plugin_seekmemory/manage/traces:
    get:
      operationId: traces
      summary: 仅管理员读取无正文的运行轨迹
      parameters:
      - name: state
        in: query
        schema:
          type: string
          enum:
          - all
          - not_recalled
          - recalled_but_withheld
          - recalled_and_injected
          - fallback_used
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracesResponse'
        '400':
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 请求失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    AstrBotAdmin:
      type: http
      scheme: bearer
      description: 宿主验证管理员身份并注入 request.username；插件页面使用宿主桥接，不持有或读取 token。
  schemas:
    JsonValue:
      description: 任意 JSON 值。扩展容器元素在传输类型中为 unknown，由 Zod 递归校验；不使用 any。
      type:
      - 'null'
      - boolean
      - number
      - string
      - array
      - object
      items: {}
      additionalProperties: true
    JsonObject:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/JsonValue'
    Scope:
      type: string
      enum:
      - private
      - shared
      - shadow
    MemoryState:
      type: string
      enum:
      - active
      - forgotten
      - merged
    MemoryCategory:
      type: string
      enum:
      - fact
      - scene
      - detail
      - impression
      - persona
      - example
      - media
      - secret
      - designated
    MemoryVersion:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        at:
          type: string
          format: date-time
        text:
          type: string
          minLength: 1
      required:
      - revision
      - at
      - text
      additionalProperties: false
    MemoryRecord:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/MemoryCategory'
        state:
          $ref: '#/components/schemas/MemoryState'
        scope:
          $ref: '#/components/schemas/Scope'
        subject:
          type: string
          minLength: 1
        session:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
            minLength: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        hits:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        versions:
          type: array
          items:
            $ref: '#/components/schemas/MemoryVersion'
          minItems: 1
        relatedIds:
          type: array
          items:
            type: string
            minLength: 1
      required:
      - id
      - title
      - text
      - category
      - state
      - scope
      - subject
      - session
      - tags
      - confidence
      - hits
      - updatedAt
      - versions
      - relatedIds
      additionalProperties: false
      description: 统一记忆库投影。版本号唯一且降序，最新版本内容与 text 一致；这些跨字段规则由 Zod 和业务测试补充验证。
    RecordsResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/MemoryRecord'
      required:
      - records
      additionalProperties: false
    ArtifactHeader:
      type: object
      properties:
        id:
          type: string
        family:
          type: string
        revision:
          type: integer
          minimum: 1
        state:
          $ref: '#/components/schemas/MemoryState'
        scope:
          $ref: '#/components/schemas/Scope'
        subject_id:
          type: string
        said_by:
          type: string
        time:
          type: object
          properties:
            created:
              type: string
            updated:
              type: string
            valid_from:
              type: [string, 'null']
            valid_to:
              type: [string, 'null']
            expires:
              type: [string, 'null']
          additionalProperties: true
      required:
      - id
      - family
      - revision
      - state
      - scope
      additionalProperties: true
    ArtifactDetail:
      type: object
      properties:
        artifact:
          type: object
          properties:
            header:
              $ref: '#/components/schemas/ArtifactHeader'
            payload:
              $ref: '#/components/schemas/JsonObject'
          required:
          - header
          - payload
          additionalProperties: false
        versions:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
        ledger:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
      required:
      - artifact
      - versions
      - sources
      - ledger
      additionalProperties: false
      description: 原始快照、来源和账本保持 JSON 扩展字段；不补造历史缺失数据。header 允许既有 lineage、strength、time 等字段。
    PendingTopic:
      type: object
      properties:
        id:
          type: string
        session:
          type: string
        count:
          type: integer
          minimum: 1
        oldestAt:
          type: [string, 'null']
          format: date-time
      required: [id, session, count, oldestAt]
      additionalProperties: false
      description: 按上游话题分组的待处理消息，仅提供计数和时间，不返回对话正文。
    CapacityStatus:
      type: object
      properties:
        state:
          type: string
          enum: [normal, pressured, saturated, protective]
        actions:
          type: array
          items:
            type: string
        reasons:
          type: array
          items:
            type: string
        pressure:
          type: number
          minimum: 0
          maximum: 1
        snapshot:
          type: object
          properties:
            sourceRows:
              type: integer
              minimum: 0
            sourceBytes:
              type: integer
              minimum: 0
            pendingRows:
              type: integer
              minimum: 0
            deferredRows:
              type: integer
              minimum: 0
            deadRows:
              type: integer
              minimum: 0
            databaseBytes:
              type: integer
              minimum: 0
            artifactCount:
              type: integer
              minimum: 0
            artifactBytes:
              type: integer
              minimum: 0
            contextChars:
              type: integer
              minimum: 0
            traceRows:
              type: integer
              minimum: 0
          required:
          - sourceRows
          - sourceBytes
          - pendingRows
          - deferredRows
          - deadRows
          - databaseBytes
          - artifactCount
          - artifactBytes
          - contextChars
          - traceRows
          additionalProperties: false
        queue:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
      required:
      - state
      - actions
      - reasons
      - pressure
      - snapshot
      - queue
      additionalProperties: false
    ContextBudget:
      type: object
      properties:
        injection_chars:
          type: integer
          minimum: 0
        system_chars:
          type: integer
          minimum: 0
        group_context_messages:
          type: integer
          minimum: 0
        history_messages:
          type: integer
          minimum: 0
        source_recall_enabled:
          type: boolean
        source_recall_hours:
          type: integer
          minimum: 1
        source_recall_max_candidates:
          type: integer
          minimum: 1
        estimate_tokens:
          type: integer
          minimum: 0
      required:
      - injection_chars
      - system_chars
      - group_context_messages
      - history_messages
      - source_recall_enabled
      - source_recall_hours
      - source_recall_max_candidates
      - estimate_tokens
      additionalProperties: false
    DreamRun:
      type: object
      properties:
        date:
          type: string
        status:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        batches:
          type: integer
          minimum: 0
        written:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            type: string
        summary:
          type: object
          additionalProperties: true
      required:
      - date
      - status
      - started_at
      - finished_at
      - batches
      - written
      - errors
      - summary
      additionalProperties: false
    DreamStatus:
      type: object
      properties:
        enabled:
          type: boolean
        at:
          type: string
        today:
          type: string
        today_run:
          anyOf:
          - $ref: '#/components/schemas/DreamRun'
          - type: 'null'
        due:
          type: boolean
        recent:
          type: array
          items:
            $ref: '#/components/schemas/DreamRun'
      required:
      - enabled
      - at
      - today
      - today_run
      - due
      - recent
      additionalProperties: false
    PersonaTimeline:
      type: object
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 0
        text:
          type: string
        revisions:
          type: array
          items:
            type: object
            properties:
              revision:
                type: integer
                minimum: 0
              at:
                type: string
              op:
                type: string
              text:
                type: string
              derivedFrom:
                type: array
                items:
                  type: string
              sourceIds:
                type: array
                items:
                  type: string
            required:
            - revision
            - at
            - op
            - text
            additionalProperties: false
          description: 每个版本只回溯自身历史 header 的证据；旧版本缺少证据时省略数组，不复制当前版本证据。
      required:
      - id
      - revision
      - text
      - revisions
      additionalProperties: false
    RuntimeStatus:
      type: object
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              ok:
                type: boolean
              detail:
                type: string
            required:
            - name
            - ok
            - detail
            additionalProperties: false
        activeTask:
          anyOf:
          - type: object
            properties:
              id:
                type: string
              kind:
                type: string
            required:
            - id
            - kind
