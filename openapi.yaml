    get:
      operationId: records
      summary: 列出全部家族、scope 和状态的记忆
      responses:
        '200':
          description: 操作成功，直接返回数据，无额外 envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsResponse'
        '403':
          description: 请求来源不允许（独立控制台）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 记忆或操作不存在
