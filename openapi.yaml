openapi: 3.1.0
info:
  title: SeekMemory 管理接口
  version: 1.0.0
  description: 宿主无关的管理操作与 JSON 正文。独立控制台通过 /api/manage/<action> 和管理员 Bearer 令牌访问；AstrBot 保留 /astrbot_plugin_seekmemory/manage/<action> 与已认证页面桥接。两种传输共用请求和响应契约，独立入口不依赖宿主请求上下文。契约版本独立于插件发布版本。
servers:
- url: /api
  description: 本机独立控制台
- url: /astrbot_plugin_seekmemory
  description: AstrBot 管理员页面桥接
security:
- ConsoleAdmin: []
- AstrBotAdmin: []
paths:
