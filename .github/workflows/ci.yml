name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装契约测试依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 语法检查
        run: |
          find . -name "*.py" -not -path "./.git/*" | xargs -I{} python -c "import ast,sys;ast.parse(open('{}').read())"
      - name: Layered tests
        run: python scripts/run_tests.py --layer all
      - name: Benchmark
        run: python benchmarks/run.py
      - name: 规模基准
        run: SCALE_USERS=8 SCALE_DAYS=30 SCALE_MSGS=40 python benchmarks/scale.py
      - name: BM25 旧集不退化与冻结验收
        run: python benchmarks/bm25.py
      - name: 长周期人格/关系评测（观察模式，不作为发布门禁）
        run: python -m benchmarks.long_horizon.run --quiet

  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.13.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: 安装开发依赖
        run: |
          python -m pip install -r requirements-dev.txt
          pnpm --dir dashboard install --frozen-lockfile
      - name: 验证生成类型、严格检查和 Mock 契约
        run: pnpm --dir dashboard check
      - name: 导出真实后端响应并验证前端契约
        run: |
          python tests/test_api_contract.py --export dashboard/node_modules/.tmp/backend-contract.json
          pnpm --dir dashboard test:contract
      - name: 构建生产视图
        run: pnpm --dir dashboard build
