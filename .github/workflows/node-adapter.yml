name: Node host adapter
on:
  push:
  pull_request:

jobs:
  node-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect DSH adapter
        id: detect
        shell: bash
        run: |
          if [ -f adapters/dsh/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "adapters/dsh is not present on this ref; skipping."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22.16.0"

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Verify Node version
        if: steps.detect.outputs.present == 'true'
        run: node --version

      - name: Syntax and manifest checks
        if: steps.detect.outputs.present == 'true'
        working-directory: adapters/dsh
        shell: bash
        run: |
          for f in src/*.js tools/*.mjs scripts/*.mjs test/*.mjs mock/*.mjs; do
            node --check "$f"
          done
          node scripts/check-manifest.mjs

      - name: Unit suites
        if: steps.detect.outputs.present == 'true'
        working-directory: adapters/dsh
        run: npm test

      - name: Build and package checks
        if: steps.detect.outputs.present == 'true'
        working-directory: adapters/dsh
        run: |
          node scripts/build-check.mjs
          npm pack --dry-run

      - name: Contract smoke against mock kernel
        if: steps.detect.outputs.present == 'true'
        working-directory: adapters/dsh
        shell: bash
        run: |
          rm -rf .tmp/mock
          mkdir -p .tmp
          node mock/kernel.mjs --data-dir .tmp/mock > .tmp/mock.log 2>&1 &
          sleep 2
          node scripts/smoke-contract.mjs --runtime .tmp/mock/runtime.json
          # 内核端点契约符合性（同一个 mock 实例，验的是契约而不是适配器行为）
          node scripts/check-kernel-contract.mjs --runtime .tmp/mock/runtime.json
